<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Bastion: close your router's backdoors</title>
  <defs>
    <radialGradient id="sky" cx="600" cy="560" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C6CFF" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#7C6CFF" stop-opacity=".07"/>
      <stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="540" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2266"/>
      <stop offset=".35" stop-color="#161236"/>
      <stop offset="1" stop-color="#07060E"/>
    </linearGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FD3FF" stop-opacity="0"/>
      <stop offset=".28" stop-color="#8FD3FF" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#F4F0FF"/>
      <stop offset=".72" stop-color="#8FD3FF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8FD3FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="170" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset=".3" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9C0FF"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4CBFF"/>
      <stop offset="1" stop-color="#7C6CFF"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5FD2" stop-opacity="0"/>
      <stop offset=".25" stop-color="#FF5FD2"/>
      <stop offset=".5" stop-color="#7C6CFF"/>
      <stop offset=".75" stop-color="#3FE3C9"/>
      <stop offset="1" stop-color="#FFC772" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="2.2" height="2.2" fill="#C4BAFF" fill-opacity=".22"/>
    </pattern>
    <linearGradient id="dotFade" x1="0" y1="540" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".1"/>
      <stop offset=".25" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".35"/>
    </linearGradient>
    <mask id="dotMask"><rect width="1200" height="630" fill="url(#dotFade)"/></mask>
    <clipPath id="planetClip"><circle cx="600" cy="2060" r="1520"/></clipPath>
    <filter id="blur18" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="630" fill="#07060E"/>
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#E9E5FF">
    <rect x="132" y="58" width="2" height="2" opacity=".6"/><rect x="318" y="132" width="1.5" height="1.5" opacity=".4"/>
    <rect x="488" y="44" width="2" height="2" opacity=".5"/><rect x="702" y="96" width="1.5" height="1.5" opacity=".7"/>
    <rect x="884" y="52" width="2" height="2" opacity=".45"/><rect x="1046" y="140" width="1.5" height="1.5" opacity=".6"/>
    <rect x="1128" y="262" width="2" height="2" opacity=".4"/><rect x="962" y="318" width="1.5" height="1.5" opacity=".5"/>
    <rect x="806" y="210" width="1.5" height="1.5" opacity=".35"/><rect x="1102" y="402" width="1.5" height="1.5" opacity=".4"/>
    <rect x="58" y="402" width="1.5" height="1.5" opacity=".35"/><rect x="640" y="170" width="1.5" height="1.5" opacity=".3"/>
  </g>

  <!-- planet -->
  <circle cx="600" cy="2060" r="1540" fill="none" stroke="#B7A9FF" stroke-opacity=".35" stroke-width="40" filter="url(#blur18)"/>
  <circle cx="600" cy="2060" r="1520" fill="url(#planet)"/>
  <g clip-path="url(#planetClip)" mask="url(#dotMask)"><rect y="530" width="1200" height="100" fill="url(#dots)"/></g>
  <circle cx="600" cy="2060" r="1520" fill="none" stroke="url(#limb)" stroke-width="10" opacity=".35" filter="url(#blur6)"/>
  <circle cx="600" cy="2060" r="1520" fill="none" stroke="url(#limb)" stroke-width="2"/>

  <!-- brand -->
  <g transform="translate(80 72)">
    <g transform="scale(1.6)">
      <path d="M14 2.5l9.5 4v6.8c0 6-4 10.7-9.5 12.7-5.5-2-9.5-6.7-9.5-12.7V6.5z" fill="url(#logo)"/>
      <path d="M9.5 14.5a6.4 6.4 0 0 1 9 0M11.6 17a3.4 3.4 0 0 1 4.8 0" fill="none" stroke="#120C2E" stroke-width="1.9" stroke-linecap="round"/>
      <circle cx="14" cy="19.6" r="1.3" fill="#120C2E"/>
    </g>
    <text x="58" y="31" fill="#F3F0FF" font-family="'Bricolage Grotesque Variable','Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif" font-size="30" font-weight="800" letter-spacing="-1">Bastion</text>
  </g>

  <!-- headline -->
  <g font-family="'Bricolage Grotesque Variable','Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif" font-weight="700" font-size="96" letter-spacing="-4.3" fill="url(#head)">
    <text x="76" y="250">Close your router’s</text>
    <text x="76" y="346">backdoors.</text>
  </g>
  <text x="80" y="408" fill="#ABA6CB" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="27" font-weight="500">Free, open-source app for Windows and macOS.</text>

  <!-- findings -->
  <g font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="17" font-weight="500">
    <g transform="translate(80 448)">
      <rect width="196" height="40" rx="20" fill="#FF8E7A" fill-opacity=".1" stroke="#FF8E7A" stroke-opacity=".35"/>
      <circle cx="22" cy="20" r="4.5" fill="#FF8E7A"/>
      <text x="38" y="26" fill="#FF8E7A">TR-069 :7547</text>
    </g>
    <g transform="translate(290 448)">
      <rect width="112" height="40" rx="20" fill="#FFC772" fill-opacity=".1" stroke="#FFC772" stroke-opacity=".35"/>
      <circle cx="22" cy="20" r="4.5" fill="#FFC772"/>
      <text x="38" y="26" fill="#FFC772">UPnP</text>
    </g>
    <g transform="translate(416 448)">
      <rect width="162" height="40" rx="20" fill="#FFC772" fill-opacity=".1" stroke="#FFC772" stroke-opacity=".35"/>
      <circle cx="22" cy="20" r="4.5" fill="#FFC772"/>
      <text x="38" y="26" fill="#FFC772">Telnet :23</text>
    </g>
    <g transform="translate(592 448)">
      <rect width="150" height="40" rx="20" fill="#B7A9FF" fill-opacity=".1" stroke="#B7A9FF" stroke-opacity=".35"/>
      <circle cx="22" cy="20" r="4.5" fill="#B7A9FF"/>
      <text x="38" y="26" fill="#B7A9FF">Plain DNS</text>
    </g>
  </g>

  <!-- iridescent hairline -->
  <rect x="300" y="626" width="600" height="2" fill="url(#iris)" opacity=".9"/>
</svg>
