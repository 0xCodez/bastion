<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Bastion</title>
  <defs>
    <!-- Squircle body: pure black with a faint cool lift at the top -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.55" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <!-- Atmospheric glow rising off the shield's sunrise edge -->
    <radialGradient id="atmo" cx="512" cy="300" r="380" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 300) scale(1 0.62) translate(0 -300)">
      <stop offset="0" stop-color="#8ec1ff" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#4f9bff" stop-opacity="0.72"/>
      <stop offset="0.62" stop-color="#3d8bff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3d8bff" stop-opacity="0"/>
    </radialGradient>
    <!-- Horizon limb that extends beyond the shield, fading at both ends -->
    <linearGradient id="limb" x1="140" y1="0" x2="884" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d8bff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#4f9bff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#4f9bff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3d8bff" stop-opacity="0"/>
    </linearGradient>
    <!-- Shield face: crisp white, a touch cooler toward the tip -->
    <linearGradient id="face" x1="0" y1="282" x2="0" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eef8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="bloom" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="squircle">
      <path d="M512 24C904 24 1000 120 1000 512S904 1000 512 1000 24 904 24 512 120 24 512 24Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#body)"/>

    <!-- Atmosphere above the sunrise edge -->
    <ellipse cx="512" cy="300" rx="400" ry="230" fill="url(#atmo)" filter="url(#soft)" opacity="0.9"/>

    <!-- Horizon limb: a long thin arc the shield sits on -->
    <path d="M140 424 Q512 168 884 424" fill="none" stroke="url(#limb)" stroke-width="10" filter="url(#bloom)"/>
    <path d="M140 424 Q512 168 884 424" fill="none" stroke="url(#limb)" stroke-width="3"/>

    <!-- Shield: the top edge is the sunrise arc -->
    <path d="M292 352Q512 212 732 352L732 540C732 690 620 790 512 850 404 790 292 690 292 540Z" fill="url(#face)"/>

    <!-- Bright rim along the sunrise edge -->
    <path d="M292 352Q512 212 732 352" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" filter="url(#bloom)" opacity="0.9"/>

    <!-- Three signal arcs, cut into the shield in black -->
    <g fill="none" stroke="#000000" stroke-linecap="round" stroke-width="38">
      <path d="M448.4 597.4A90 90 0 0 1 575.6 597.4"/>
      <path d="M398.9 547.9A160 160 0 0 1 625.1 547.9"/>
      <path d="M349.4 498.4A230 230 0 0 1 674.6 498.4"/>
    </g>
    <circle cx="512" cy="664" r="30" fill="#3d8bff"/>
  </g>

  <!-- Thin 1px-style rule around the squircle -->
  <path d="M512 26C902 26 998 122 998 512S902 998 512 998 26 902 26 512 122 26 512 26Z" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
</svg>
